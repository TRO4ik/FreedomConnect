

name: Build Freedom Connect



on:

  workflow_dispatch:



permissions:

  contents: read



jobs:

  android:

    name: Build Android APK

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2

        with:

          channel: stable

      - name: Generate Android platform files

        run: flutter create --platforms=android --project-name freedom_connect .

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4

        with:

          name: freedom-connect-android-apk

          path: build/app/outputs/flutter-apk/app-release.apk



  windows:

    name: Build Windows app

    runs-on: windows-latest

    steps:

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2

        with:

          channel: stable

      - run: flutter config --enable-windows-desktop

      - run: flutter create --platforms=windows --project-name freedom_connect .

      - run: flutter pub get

      - run: flutter build windows --release

      - shell: pwsh

        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath FreedomConnect-Windows.zip

      - uses: actions/upload-artifact@v4

        with:

          name: freedom-connect-windows

          path: FreedomConnect-Windows.zip




